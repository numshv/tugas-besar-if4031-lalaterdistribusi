apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: bmkg-mock-config
    literals:
      - BMKG_PORT=8081
      - BMKG_DELAY_MIN_MS=50
      - BMKG_DELAY_MAX_MS=150
      - BMKG_SEED_COUNT=20
      - BMKG_EVENT_INTERVAL_SECONDS=10
