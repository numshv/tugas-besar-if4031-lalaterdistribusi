apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client-api
  template:
    metadata:
      labels:
        app: client-api
        role: api
    spec:
      containers:
        - name: client-api
          image: bnpb/client-api
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: client-api-config
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
