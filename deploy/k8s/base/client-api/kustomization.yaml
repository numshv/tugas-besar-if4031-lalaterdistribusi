apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: client-api-config
    literals:
      - CLIENT_API_PORT=8080
      - AGGREGATOR_BASE_URL=http://aggregator:8083
      - AUTH_BASE_URL=http://auth-service:8084
      - AUTH_JWKS_URL=http://auth-service:8084/.well-known/jwks.json
      - CLIENT_API_MAX_CONCURRENCY=200
      - MAX_CONCURRENT_REQUESTS=200
      - HTTP_CLIENT_TIMEOUT_MS=5000
      - STALE_THRESHOLD_SECONDS=30
