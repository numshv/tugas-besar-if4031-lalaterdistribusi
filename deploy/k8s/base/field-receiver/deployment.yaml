apiVersion: apps/v1
kind: Deployment
metadata:
  name: field-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: field-receiver
  template:
    metadata:
      labels:
        app: field-receiver
        role: consumer
    spec:
      containers:
        - name: field-receiver
          image: bnpb/field-receiver
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: field-receiver-config
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8089
