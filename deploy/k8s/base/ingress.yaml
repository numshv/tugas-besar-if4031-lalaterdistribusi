apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bnpb
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8084
          - path: /refresh
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8084
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8084
          - path: /internal/audit
            pathType: Prefix
            backend:
              service:
                name: aggregator
                port:
                  number: 8083
          - path: /internal/ops
            pathType: Prefix
            backend:
              service:
                name: aggregator
                port:
                  number: 8083
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-api
                port:
                  number: 8080
