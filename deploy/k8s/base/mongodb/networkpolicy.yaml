apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-only-aggregator
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aggregator
      ports:
        - port: 27017
