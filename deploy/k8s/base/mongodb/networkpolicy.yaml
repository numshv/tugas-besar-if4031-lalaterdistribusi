apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongos-only-aggregator
spec:
  podSelector:
    matchLabels:
      app: mongos
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aggregator
        - podSelector:
            matchLabels:
              app: mongo-init
      ports:
        - port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-members-internal
spec:
  podSelector:
    matchLabels:
      bnpb/mongo-member: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              bnpb/mongo-member: "true"
        - podSelector:
            matchLabels:
              app: mongos
        - podSelector:
            matchLabels:
              app: mongo-init
        - podSelector:
            matchLabels:
              app: aggregator
      ports:
        - port: 27017
