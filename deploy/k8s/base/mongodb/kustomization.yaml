apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mongodb-config
    literals:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_DATABASE=bnpb
      - MONGO_APP_USERNAME=bnpb_app
  - name: mongodb-init
    files:
      - mongo-init.js
