apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - generated
  - mongos.yaml
  - service.yaml
  - init-job.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mongodb-config
    literals:
      - MONGO_ROOT_USERNAME=root
      - MONGO_APP_USERNAME=bnpb_app
      - MONGO_MONITOR_USERNAME=bnpb_monitor
  - name: mongodb-init
    files:
      - mongo-init.js
  - name: mongod-conf
    files:
      - mongod.conf
  - name: mongod-start
    files:
      - mongod-start.sh
      - bootstrap.js
  - name: mongo-topology
    files:
      - topology.json
      - MONGO_CONFIGDB=configdb.txt
