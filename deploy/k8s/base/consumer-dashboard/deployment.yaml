apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-dashboard
  template:
    metadata:
      labels:
        app: consumer-dashboard
        role: consumer
    spec:
      containers:
        - name: consumer-dashboard
          image: bnpb/consumer-dashboard
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: consumer-dashboard-config
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
