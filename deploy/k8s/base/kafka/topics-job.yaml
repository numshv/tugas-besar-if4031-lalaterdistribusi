apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: kafka-topics-init
        role: other
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "/scripts/create-topics.sh"]
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: kafka-topics
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: kafka-topics
