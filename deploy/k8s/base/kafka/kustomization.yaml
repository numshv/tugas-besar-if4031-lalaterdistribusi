apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - topics-job.yaml
configMapGenerator:
  - name: kafka-config
    literals:
      - CLUSTER_ID=5L6g3nShT-eMCtK--X86sw
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-0.kafka:9093,2@kafka-1.kafka:9093,3@kafka-2.kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_HEAP_OPTS=-Xms384m -Xmx384m
  - name: kafka-topics
    literals:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC_PARTITIONS=3
      - KAFKA_TOPIC_RETENTION_MS=86400000
      - KAFKA_TOPICS=bnpb.hazard-events.v1:3:86400000,bnpb.hazard-upserts.v1:6:604800000,bnpb.field-reports.v1:3:604800000,bnpb.critical-alerts.v1:3:604800000,bnpb.sensor-rejected.v1:3:604800000
      - KAFKA_COMPACTED_TOPICS=bnpb.wildfire-snapshots.v1:1:68157440
      - KAFKA_REPLICATION_FACTOR=3
      - KAFKA_HEAP_OPTS=-Xmx128m
    files:
      - create-topics.sh
