apiVersion: apps/v1
kind: Deployment
metadata:
  name: coastal-ingester
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coastal-ingester
  template:
    metadata:
      labels:
        app: coastal-ingester
        role: consumer
    spec:
      serviceAccountName: coastal-ingester
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: coastal-ingester
      containers:
        - name: coastal-ingester
          image: bnpb/coastal-ingester
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: coastal-ingester-config
          env:
            - name: PANTAI_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pantai-token
                  key: token
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
