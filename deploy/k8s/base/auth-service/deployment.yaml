apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        role: api
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: auth-service
          image: bnpb/auth-service
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: auth-service-config
          env:
            - name: CLIENT_MEDIA_SECRET
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: CLIENT_MEDIA_SECRET
            - name: CLIENT_FIELD_SECRET
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: CLIENT_FIELD_SECRET
            - name: CLIENT_OPS_SECRET
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: CLIENT_OPS_SECRET
          volumeMounts:
            - name: jwt-key
              mountPath: /run/keys
              readOnly: true
            - name: state
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
      volumes:
        - name: jwt-key
          secret:
            secretName: auth-jwt-key
            defaultMode: 0440
        - name: state
          persistentVolumeClaim:
            claimName: auth-state
