apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        role: aggregator
    spec:
      serviceAccountName: aggregator
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aggregator
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: aggregator
          image: bnpb/aggregator
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: aggregator-config
          env:
            - name: BMKG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: BMKG_API_KEY
            - name: PVMBG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: PVMBG_TOKEN
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: MONGO_APP_PASSWORD
            - name: MONGO_URI
              value: mongodb://$(MONGO_APP_USERNAME):$(MONGO_APP_PASSWORD)@mongodb:27017/$(MONGO_DB)?authSource=$(MONGO_DB)
            - name: TOPOLOGY_JSON
              valueFrom:
                configMapKeyRef:
                  name: mongo-topology
                  key: topology.json
            - name: MONGO_MONITOR_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGO_MONITOR_USERNAME
            - name: MONGO_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: MONGO_MONITOR_PASSWORD
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AUDIT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: bnpb-secrets
                  key: AUDIT_TOKENS
                  optional: true
          volumeMounts:
            - name: mapping-rules
              mountPath: /etc/bnpb/mapping-rules
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
      volumes:
        - name: mapping-rules
          configMap:
            name: aggregator-mapping-rules
