apiVersion: apps/v1
kind: Deployment
metadata:
  name: field-report-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: field-report-api
  template:
    metadata:
      labels:
        app: field-report-api
        role: api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: field-report-api
      containers:
        - name: field-report-api
          image: bnpb/field-report-api
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: field-report-api-config
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
