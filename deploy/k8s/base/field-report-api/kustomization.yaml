apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: field-report-api-config
    literals:
      - FIELD_REPORT_API_PORT=8085
      - FIELD_REPORTS_TOPIC=bnpb.field-reports.v1
      - PRODUCE_TIMEOUT_MS=3000
      - AGGREGATOR_BASE_URL=http://aggregator:8083
      - AUTH_JWKS_URL=http://auth-service:8084/.well-known/jwks.json
