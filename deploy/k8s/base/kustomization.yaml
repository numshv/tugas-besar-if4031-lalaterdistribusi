apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb
resources:
  - namespace.yaml
  - mongodb
  - kafka
  - aggregator
  - bmkg-mock
  - pvmbg-mock
  - auth-service
  - client-api
  - consumer-dashboard
  - consumer-notifier
  - consumer-regional
configMapGenerator:
  - name: bnpb-common
    literals:
      - LOG_LEVEL=info
      - APP_ENV=development
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=bnpb.hazard-events.v1
      - MONGO_DB=bnpb
      - JWT_ISSUER=bnpb-auth
      - JWT_AUDIENCE=client-api
