apiVersion: batch/v1
kind: Job
metadata:
  name: hazard-loader
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: hazard-loader
        role: other
    spec:
      restartPolicy: Never
      containers:
        - name: loader
          image: bnpb/aggregator:dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/loader"]
          args:
            - --mode=load
            - --url=https://example.invalid/katalog-gempa.csv
            - --rate=500
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_UPSERTS_TOPIC
              value: bnpb.hazard-upserts.v1
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
